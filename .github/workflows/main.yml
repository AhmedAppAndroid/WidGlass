
name: GlassFlow CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GlassFlow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify application files
        run: |
          test -f index.html || {
            echo "::error::index.html is missing"
            exit 1
          }
          test -f styles.css || {
            echo "::error::styles.css is missing"
            exit 1
          }
          test -f app.js || {
            echo "::error::app.js is missing"
            exit 1
          }

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy GlassFlow
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        
